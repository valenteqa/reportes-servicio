<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reportes de Servicio</title>
<!-- interactive-widget=resizes-content: cuando sale el teclado, Android encoge
     la pantalla de la app en vez de taparla; asi las hojas suben y los botones
     Cancelar/Crear quedan visibles mientras escribes. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<meta name="description" content="Bitacora de servicios de mantenimiento en planta: equipos, notas, tablas y fotos.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f4">
<script>
// Aplicar el tema guardado antes del primer pintado, para que no destelle.
// El claro es el predeterminado; oscuro solo si el usuario lo eligio.
try {
  if (localStorage.getItem('tema') !== 'oscuro') {
    document.documentElement.dataset.tema = 'claro';
  } else {
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = '#07090d';
  }
} catch (e) { document.documentElement.dataset.tema = 'claro'; }
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reportes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icono-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="cargando">
      <div class="cargando__marca">Reportes de Servicio</div>
      <div class="cargando__barra"><span></span></div>
    </div>
  </div>

  <noscript>
    <p style="padding:2rem;font-family:system-ui">
      Esta aplicacion necesita JavaScript activado.
    </p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
